name: Main workflow
run-name: Main workflow by ${{ github.actor }}
on:
  push:
    branches:
      - main
jobs:
  lint:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run flake8
        uses: py-actions/flake8@v2
        with:
          path: "src"